name: Deploy CDR FEM FCT lab to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Version the app and worker assets
        run: node CDR_visualizer/scripts/version-assets.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the static app
        uses: actions/upload-pages-artifact@v4
        with:
          path: CDR_visualizer/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
